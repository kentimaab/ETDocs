[project]

site_name = "Ethiris Docs"
site_description = "Documentation for Ethiris VMS and its solutions"
site_author = "Markus Kvist"
site_url = "https://www.ethiris.com/docs/en/"
docs_dir = "docs-en"
site_dir = "site/en"

copyright = """Kentima AB
Copyright &copy; 2026 The authors
"""

nav = [
  { "Home" = "index.md" },
  { "Ethiris" = [
    { "Ethiris" = "ethiris/index.md" },
    { "Manual" = "ethiris/manual/index.md" },
    { "Knowledge base" = [
      { "Overview" = "ethiris/knowledge-base/index.md" },
      { "Slow connection after upgrade" = "ethiris/knowledge-base/kb2020010901-langsom-anslutning.md" },
      { "SSO – Service account in Active Directory" = "ethiris/knowledge-base/kb2021062101-sso-servicekonto.md" },
      { "Sending email via SMTP" = "ethiris/knowledge-base/kb2022022201-smtp-epost.md" },
      { "GPU and adaptive video streams" = "ethiris/knowledge-base/kb2023020201-gpu-adaptiva-strommar.md" },
      { "Ethiris VMS license model" = "ethiris/knowledge-base/ethiris-vms-licensmodell.md" },
      { "EthirisMonitor64.sys and antivirus protection" = "ethiris/knowledge-base/kb2025092301-ethirismonitor-antivirus.md" },
    ]},
    { "Release Notes" = "ethiris/versionsnyheter/index.md" },
    { "Camera Support" = "ethiris/kamerastod/index.md" },
  ]},
  { "Solutions" = [
    { "License Plate Recognition" = [
      { "Overview" = "losningar/nummerplatsavlasning/oversikt.md" },
      { "Usage" = "losningar/nummerplatsavlasning/anvandning.md" },
      { "Advanced" = "losningar/nummerplatsavlasning/avancerat.md" },
    ]},
    { "Omnis Integration" = [
      { "Overview" = "losningar/omnis-integration/oversikt.md" },
      { "Usage" = "losningar/omnis-integration/anvandning.md" },
      { "Advanced" = "losningar/omnis-integration/avancerat.md" },
    ]},
    { "Ethiris Monitoring Dashboard" = [
      { "Overview" = "losningar/ethiris-monitoring-dashboard/oversikt.md" },
      { "Usage" = "losningar/ethiris-monitoring-dashboard/anvandning.md" },
      { "Advanced" = "losningar/ethiris-monitoring-dashboard/avancerat.md" },
    ]},
    { "Send SMS with Teltonika" = [
      { "Overview" = "losningar/teltonika-sms/oversikt.md" },
      { "Installation" = "losningar/teltonika-sms/installation.md" },
      { "Usage" = "losningar/teltonika-sms/anvandning.md" },
      { "Advanced" = "losningar/teltonika-sms/avancerat.md" },
    ]},
  ]},
  { "Script Library" = [
    { "Overview" = "skriptbibliotek/index.md" },
    { "scExtensions" = [
      { "Overview" = "skriptbibliotek/scextensions/oversikt.md" },
      { "Usage" = "skriptbibliotek/scextensions/anvandning.md" },
    ]},
    { "scFile" = [
      { "Overview" = "skriptbibliotek/scfile/oversikt.md" },
      { "Usage" = "skriptbibliotek/scfile/anvandning.md" },
    ]},
    { "scSaveImage" = [
      { "Overview" = "skriptbibliotek/scsaveimage/oversikt.md" },
      { "Usage" = "skriptbibliotek/scsaveimage/anvandning.md" },
    ]},
